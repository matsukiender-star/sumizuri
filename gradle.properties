# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
# The build tool stops after ten idle minutes instead of three hours, and runs at low priority so the computer stays usable while it builds.
org.gradle.daemon.idletimeout=600000
org.gradle.priority=low
# The Kotlin compiler runs inside the build tool instead of as a second program that also stays behind.
kotlin.compiler.execution.strategy=in-process
# Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# The version of the app. Android, the desktop installers and the Settings page all read it. Between releases it ends in -dev, so a build by hand says it is a development build, and the app counts it as older than the release of the same number. A release tag sets the real version and the code for its builds.
app.version=0.4.0-dev
app.versionCode=4000

# The GitHub or GitLab repo the app checks for new versions, such as https://github.com/owner/repo. Leave it empty to turn the check off until a repo is ready. A person can also set one in Settings.
app.updateRepo=https://github.com/not-akari/sumizuri

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# iOS simulator tests need a Mac, so a Windows or Linux build skips them without a warning.
kotlin.native.ignoreDisabledTargets=true
